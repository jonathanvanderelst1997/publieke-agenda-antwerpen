<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mijn publieke agenda voor District Antwerpen met activiteiten, sportmomenten en openbare werken."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_BE" />
    <meta property="og:title" content="Mijn publieke agenda voor District Antwerpen" />
    <meta
      property="og:description"
      content="Bekijk actuele activiteiten, sportmomenten en openbare werken in District Antwerpen."
    />
    <meta property="og:url" content="https://mijn-publieke-agenda-voor-district.onrender.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mijn publieke agenda voor District Antwerpen" />
    <meta
      name="twitter:description"
      content="Bekijk actuele activiteiten, sportmomenten en openbare werken in District Antwerpen."
    />
    <link rel="canonical" href="https://mijn-publieke-agenda-voor-district.onrender.com/" />
    <script>
      {
        const canonicalHost = "mijn-publieke-agenda-voor-district.onrender.com";
        const oldHosts = new Set([
          "publieke-agenda-antwerpen.onrender.com",
          "mijn-agenda-district-antwerpen.onrender.com",
        ]);
        if (oldHosts.has(window.location.hostname)) {
          window.location.replace(`https://${canonicalHost}${window.location.pathname}${window.location.search}${window.location.hash}`);
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Mijn publieke agenda voor District Antwerpen",
        "url": "https://mijn-publieke-agenda-voor-district.onrender.com/",
        "inLanguage": "nl-BE",
        "description": "Actuele activiteiten, sportmomenten en openbare werken in District Antwerpen."
      }
    </script>
    <title>Mijn publieke agenda voor District Antwerpen</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Ga naar de agenda</a>
    <main id="main-content" class="agenda-page">
      <header class="agenda-header">
        <div>
          <h1>Mijn publieke agenda voor District Antwerpen</h1>
          <p>
            Activiteiten, sportmomenten en werken overzichtelijk per datum en uur. Klik op een onderwerp voor details en
            de publieke bron.
          </p>
        </div>
        <aside class="agenda-count" aria-label="Aantal agenda-items">
          <span id="agenda-count-value">0</span>
          <strong>geverifieerde punten</strong>
          <small id="agenda-count-detail"></small>
        </aside>
      </header>

      <p id="agenda-refresh-note" class="agenda-refresh-note" aria-live="polite"></p>

      <section class="agenda-controls" aria-label="Agenda filteren">
        <div class="agenda-controls-title">Thema's</div>
        <div id="theme-controls" class="theme-controls"></div>
      </section>

      <section id="agenda-list" class="agenda-list" aria-label="Kalender per datum"></section>
    </main>

    <script src="/agenda-refresh.js"></script>
    <script src="/agenda-ics.js"></script>
    <script src="/agenda.js"></script>
  </body>
</html>

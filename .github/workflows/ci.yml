# Deze naam is de binding in de Gateway: config/operator-repositories.json
# (publieke-agenda, required_workflows) noemt "Public Agenda Validate" op dit
# pad, en de operator zoekt runs op precies die naam. Hernoem je hem, dan
# wordt die controle voor deze repo nooit meer groen.
name: Public Agenda Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Deze repo is publiek: GitHub-gehoste runners kosten hier geen minuten.
    # Laat deze job nooit naar een self-hosted runner verhuizen. Bij een
    # publieke repo kan elke fork een PR openen, en die code zou dan op de Mac
    # van de eigenaar draaien.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v6 en niet v4: v4 draait op Node.js 20, dat GitHub afbouwt; de eerste
      # run gaf daar een waarschuwing voor. v6 draait op node24.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          # package.json vraagt node >=20; 22 is de LTS waarmee lokaal getest is.
          node-version: 22

      - name: Afhankelijkheden (lockfile, zonder scripts)
        run: npm ci --ignore-scripts

      # Bouwt manifest, provenance-SLA en snapshot opnieuw en draait daarna
      # lint, tests, eventaudit, deeplinks, ICS, sitekwaliteit en headers.
      # Alles lokaal en zonder netwerk; dezelfde stap als in README.md.
      - name: npm run check
        run: npm run check

      # De build is deterministisch. Wijkt het resultaat af van wat in de
      # commit staat, dan is er een gegenereerd bestand niet meegecommit en zou
      # Render iets anders publiceren dan wat hier gecontroleerd werd.
      - name: Gegenereerde bestanden staan in de commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::npm run check wijzigde bestanden die niet in de commit staan:"
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

  # data-only: een toekomstige verplichte controle (ruleset op main). De job
  # draait altijd en wordt nooit overgeslagen via een if: op de job; de keuze
  # valt binnen de stappen.
  # - Kop data/refresh-*: elk gewijzigd pad staat in de padlijst van de
  #   BASIScommit (een PR kan zijn eigen lijst dus nooit verruimen),
  #   verwijderen alleen onder deletableUnder, en elke commit is van
  #   github-actions[bot].
  # - Elke andere PR, en een push naar main: codelaan, lege doorgang. Code
  #   gaat alleen live met de toegangscode van de eigenaar, via de Gateway.
  # Een spiegel, geen bewijs: een commit-e-mailadres kan iedereen met
  # schrijfrechten zetten. Het bewijs is het artefact data-lane-binding van
  # refresh.yml, dat de Gateway toetst.
  data-only:
    name: data-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Codelaan of databaan
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          lane=code
          if [ "$EVENT_NAME" = "pull_request" ]; then
            case "$HEAD_REF" in
              data/refresh-*) lane=data ;;
            esac
          fi
          if [ "$lane" = "code" ]; then
            echo "Codelaan: mergen vraagt de toegangscode van de eigenaar"
            echo "lane=code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ $HEAD_REF =~ ^data/refresh-[0-9]{8}-[0-9]+$ ]]; then
            echo "::error title=data-only::Datatak met een onbekende naam; verwacht data/refresh-<JJJJMMDD>-<run_id>."
            exit 1
          fi
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error title=data-only::Een datatak moet uit deze repo komen, niet uit een fork."
            exit 1
          fi
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error title=data-only::Een datatak gaat alleen naar de standaardtak."
            exit 1
          fi
          echo "Databaan: alleen data, alleen van github-actions[bot]."
          echo "lane=data" >> "$GITHUB_OUTPUT"

      - name: Basiscommit ophalen
        if: steps.lane.outputs.lane == 'data'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Alleen data, alleen van de bot
        if: steps.lane.outputs.lane == 'data'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # >>> databaantoets (letterlijk dezelfde tekst in refresh.yml en ci.yml)
          # Faalt dicht. $1 = padlijst (JSON), $2 = 'git diff --name-status -M0',
          # $3 = 'git diff --raw -M0 --no-abbrev' van dezelfde wijziging.
          # Elk pad moet volledig op een patroon passen (^(patroon)$), D alleen
          # onder deletableUnder, een hernoeming (R) telt als D van het oude en A
          # van het nieuwe pad, alleen gewone bestanden (100644), lijst niet leeg.
          lane_fail() { printf 'AFGEWEZEN %s %s: %s\n' "$1" "$2" "$3"; }
          lane_allowed() {
            local re full
            for re in "${lane_allowed_list[@]}"; do
              full="^(${re})\$"
              if [[ $1 =~ $full ]]; then return 0; fi
            done
            return 1
          }
          lane_deletable() {
            local d
            for d in ${lane_deletable_list[@]+"${lane_deletable_list[@]}"}; do
              case "$1" in "$d"*) return 0 ;; esac
            done
            return 1
          }
          lane_check() {
            local bad=0 n=0 m=0 rc full status p1 p2 extra line meta om nm
            lane_allowed_list=() lane_deletable_list=()
            if ! jq -e '.schemaVersion == 1
                and (.allowed | type == "array" and length > 0
                     and all(.[]; type == "string" and length > 0 and (contains("\n") | not)))
                and (.deletableUnder | type == "array"
                     and all(.[]; type == "string" and endswith("/") and (contains("\n") | not)))' "$1" >/dev/null; then
              echo "::error title=Databaan::De padlijst heeft niet de vorm {schemaVersion:1, allowed:[...], deletableUnder:[...]}."
              return 1
            fi
            while IFS= read -r line; do lane_allowed_list+=("$line"); done < <(jq -r '.allowed[]' "$1")
            while IFS= read -r line; do lane_deletable_list+=("$line"); done < <(jq -r '.deletableUnder[]' "$1")
            # Elk patroon moet compileren, ook als een eerder patroon al past.
            for line in "${lane_allowed_list[@]}"; do
              rc=0 full="^(${line})\$"
              [[ x =~ $full ]] || rc=$?
              if [ "$rc" -eq 2 ]; then lane_fail regex "$line" "ongeldig patroon in de padlijst"; bad=1; fi
            done
            if [ "$bad" -ne 0 ]; then
              echo "::error title=Databaan::De padlijst bevat een ongeldig patroon."
              return 1
            fi
            while IFS=$'\t' read -r status p1 p2 extra || [ -n "$status" ]; do
              if [ -z "$status" ] && [ -z "$p1" ]; then continue; fi
              n=$((n + 1))
              case "$status" in
                A|M)
                  if [ -z "$p1" ] || [ -n "$p2" ] || ! lane_allowed "$p1"; then
                    lane_fail "$status" "$p1" "pad staat niet in de datalijst"; bad=1
                  fi ;;
                D)
                  if [ -z "$p1" ] || [ -n "$p2" ] || ! lane_allowed "$p1"; then
                    lane_fail D "$p1" "pad staat niet in de datalijst"; bad=1
                  elif ! lane_deletable "$p1"; then
                    lane_fail D "$p1" "verwijderen mag alleen onder deletableUnder"; bad=1
                  fi ;;
                R[0-9]*)
                  if [ -z "$p1" ] || [ -z "$p2" ] || [ -n "$extra" ]; then
                    lane_fail "$status" "$p1" "onvolledige hernoeming"; bad=1
                  else
                    if ! lane_allowed "$p1" || ! lane_deletable "$p1"; then
                      lane_fail "$status" "$p1" "oud pad mag niet verdwijnen"; bad=1
                    fi
                    if ! lane_allowed "$p2"; then
                      lane_fail "$status" "$p2" "nieuw pad staat niet in de datalijst"; bad=1
                    fi
                  fi ;;
                *)
                  lane_fail "$status" "$p1" "status niet toegelaten in de databaan"; bad=1 ;;
              esac
            done < "$2"
            while IFS= read -r line || [ -n "$line" ]; do
              if [ -z "$line" ]; then continue; fi
              m=$((m + 1))
              meta=${line%%$'\t'*}
              read -r om nm _ <<<"$meta"
              case "$nm" in
                100644|000000) ;;
                *) lane_fail "modus-$nm" "${line#*$'\t'}" "alleen gewone bestanden (100644)"; bad=1 ;;
              esac
            done < "$3"
            if [ "$n" -eq 0 ]; then
              echo "::error title=Databaan::Lege wijzigingslijst: niets om te publiceren."; bad=1
            fi
            if [ "$m" -ne "$n" ]; then
              echo "::error title=Databaan::De twee diff-lijsten verschillen in lengte (${n} tegen ${m})."; bad=1
            fi
            if [ "$bad" -ne 0 ]; then
              echo "::error title=Databaan::Wijziging buiten de databaan; zie de regels die met AFGEWEZEN beginnen."
            fi
            return "$bad"
          }
          # <<< databaantoets

          if ! [[ $PR_NUMBER =~ ^[0-9]+$ && $BASE_SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=data-only::Onverwacht PR-nummer of onverwachte SHA."; exit 1
          fi
          git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          if [ "$(git rev-parse refs/remotes/pr/head)" != "$HEAD_SHA" ]; then
            echo "::error title=data-only::De PR-kop bewoog tijdens deze run; de nieuwe push krijgt een eigen run."; exit 1
          fi

          # De padlijst uit de BASIScommit, nooit uit de PR zelf.
          if ! git show "${BASE_SHA}:lib/data-lane-paths.json" > "$RUNNER_TEMP/paths.json"; then
            echo "::error title=data-only::lib/data-lane-paths.json ontbreekt op de basis; de databaan bestaat daar nog niet."; exit 1
          fi
          git diff --name-status -M0 "${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/changes.txt"
          git diff --raw -M0 --no-abbrev "${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/raw.txt"
          bad=0
          lane_check "$RUNNER_TEMP/paths.json" "$RUNNER_TEMP/changes.txt" "$RUNNER_TEMP/raw.txt" || bad=1

          git log --format='%H%x09%ae%x09%ce' "${BASE_SHA}..${HEAD_SHA}" > "$RUNNER_TEMP/commits.txt"
          if [ ! -s "$RUNNER_TEMP/commits.txt" ]; then
            echo "::error title=data-only::Geen enkele commit tussen basis en kop."; bad=1
          fi
          while IFS=$'\t' read -r sha author committer; do
            if [ "$author" != "$BOT_EMAIL" ] || [ "$committer" != "$BOT_EMAIL" ]; then
              echo "AFGEWEZEN commit ${sha}: niet van github-actions[bot]"; bad=1
            fi
          done < "$RUNNER_TEMP/commits.txt"
          if [ "$bad" -ne 0 ]; then
            echo "::error title=data-only::Deze PR is geen zuivere databaan-PR; zie de regels die met AFGEWEZEN beginnen."
            exit 1
          fi
          echo "Databaan in orde: $(wc -l < "$RUNNER_TEMP/changes.txt") pad(en), $(wc -l < "$RUNNER_TEMP/commits.txt") commit(s) van github-actions[bot]."

  # Proef voor Ubuntu 26.04. ubuntu-latest verhuist daarheen tussen 19 oktober
  # en 19 november 2026. Daar zijn date (Rust-coreutils), jq (1.8) en bash (5.3)
  # andere versies, en refresh.yml leunt op alle drie (date -u -d, jq, de
  # databaantoets). Deze job draait de check en een droge verversing op 26.04
  # (scripts/refresh-droog.mjs): de run-stappen van refresh.yml zelf, met lezen
  # van het netwerk maar zonder schrijven (geen push, geen tak, geen issue).
  # continue-on-error: rood hier maakt de run niet rood, en de Gateway kijkt
  # alleen naar 'check' en 'data-only'. Faalt hij: zie docs/UBUNTU_2604.md.
  # Net als check: nooit op een self-hosted runner (publieke repo, forks).
  ubuntu-2604-proef:
    name: ubuntu-26.04-proef
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      # Offline: versies van de image en vaste uitkomsten van date, jq, bash,
      # sort/tail en base64, plus de databaantoets uit refresh.yml.
      - name: Gereedschap en vaste uitkomsten
        run: node scripts/refresh-droog.mjs gereedschap

      # De volgende stappen draaien ook als een vorige faalde: zo toont één run
      # alles wat op 26.04 anders loopt.
      - name: Afhankelijkheden (lockfile, zonder scripts)
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts

      - name: npm run check
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Gegenereerde bestanden staan in de commit
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::npm run check wijzigde bestanden die niet in de commit staan:"
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

      # Bij een datatak-PR liep de verversing net: dan geen tweede keer de
      # bronnen ophalen, alleen de rest van de keten met een verzonnen
      # generatedAt.
      - name: Droge verversing (leest, schrijft niets)
        if: ${{ !cancelled() }}
        env:
          DROOG_ZONDER_OPHALEN: ${{ startsWith(github.head_ref, 'data/refresh-') && '1' || '' }}
        run: node scripts/refresh-droog.mjs verversing

  # gitleaks (MIT, gratis, offline) in meldstand: de standaardregels voor
  # sleutels en tokens plus eigen regels voor persoonsgegevens (.gitleaks.toml).
  # Faalt nooit de run: --exit-code 0 in scripts/gitleaks-meld.mjs en
  # continue-on-error hier. Het logboek en de samenvatting tonen alleen
  # aantallen per regel en bestandsnamen; het rapport zelf blijft in
  # RUNNER_TEMP en wordt niet opgeladen (dit is een publieke repo).
  # De CLI en geen gitleaks-action: geen licentiesleutel, geen schrijfrechten.
  gitleaks:
    name: gitleaks (meldt)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      # Vaste versie, en de sha256 uit gitleaks_8.30.1_checksums.txt van de
      # release. Een nieuwe versie: beide waarden samen aanpassen.
      - name: gitleaks ophalen (vaste versie, sha256 nagekeken)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$dir/gitleaks.tar.gz" "$url"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "GITLEAKS_BIN=$dir/gitleaks" >> "$GITHUB_ENV"

      # De eigen regels op verzonnen voorbeelden (tests/fixtures/gitleaks/):
      # elke regel vindt wat ze moet vinden, en de allowlists laten door wat
      # publiek is.
      - name: Eigen regels werken
        run: node --test tests/gitleaks-meld.test.mjs

      - name: Wat deze wijziging toevoegt
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          else
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          if ! [[ $range =~ ^[0-9a-f]{40}\.\.[0-9a-f]{40}$ ]] || [[ $range == 0000000000000000000000000000000000000000..* ]]; then
            echo "Geen bruikbaar commitbereik; alleen de werkboom wordt gescand."
            exit 0
          fi
          node scripts/gitleaks-meld.mjs commits "$range"

      - name: Wat nu in de werkboom staat
        if: ${{ !cancelled() }}
        run: node scripts/gitleaks-meld.mjs boom
